[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyst"
version = "0.1.0"
description = "Private family PDF digest and recommendation extraction tool."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "pytesseract>=0.3",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "scrapling>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
